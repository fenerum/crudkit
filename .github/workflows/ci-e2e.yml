name: e2e

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Proves a fresh project can build on the published artifact: build the SPA,
# build the wheel, install it (not editable) into a clean venv, and serve the
# demo project from it.
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the SPA into the package
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Build the wheel
        working-directory: backend
        run: uv build
      - name: Install the wheel into a fresh venv
        run: |
          uv venv /tmp/e2e
          uv pip install --python /tmp/e2e "django-crudkit[api] @ file://$PWD/$(ls backend/dist/*.whl)"
      - name: Migrate
        run: /tmp/e2e/bin/python examples/demo/manage.py migrate --noinput
      - name: Boot the demo server and probe it
        run: |
          /tmp/e2e/bin/python examples/demo/manage.py runserver 127.0.0.1:8000 --noreload > /tmp/server.log 2>&1 &
          trap 'cat /tmp/server.log' EXIT
          curl -s --retry 30 --retry-delay 1 --retry-connrefused -o /dev/null http://127.0.0.1:8000/
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/BOK/metadata/)
          echo "GET /api/v1/BOK/metadata/ -> $code"
          test "$code" = "200"
          curl -s http://127.0.0.1:8000/ > /tmp/index.html
          grep -F 'id="crudkit-config"' /tmp/index.html
          grep -F 'CrudKit Demo' /tmp/index.html
          ! grep -F '{{ crudkit_config_json }}' /tmp/index.html
