name: e2e

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Proves a fresh project can build on the published artifact: build the SPA,
# build the wheel, install it (not editable) into a clean venv, and serve the
# demo project from it.
jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      # Deliberately not "static/": proves the SPA has no hardcoded prefix.
      DEMO_STATIC_URL: media-x/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the SPA into the package
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Build the wheel
        working-directory: backend
        run: uv build
      - name: Install the wheel into a fresh venv
        run: |
          uv venv /tmp/e2e
          uv pip install --python /tmp/e2e "crudkit[api] @ file://$PWD/$(ls backend/dist/*.whl)"
      - name: Migrate and create a user
        run: |
          /tmp/e2e/bin/python examples/demo/manage.py migrate --noinput
          /tmp/e2e/bin/python examples/demo/manage.py shell -c "
          from django.contrib.auth.models import User
          User.objects.create_superuser('e2e', password='e2e-password')"
      - name: Boot the demo server and probe it
        run: |
          /tmp/e2e/bin/python examples/demo/manage.py runserver 127.0.0.1:8000 --noreload > /tmp/server.log 2>&1 &
          trap 'cat /tmp/server.log' EXIT
          curl -s --retry 30 --retry-delay 1 --retry-connrefused -o /dev/null http://127.0.0.1:8000/

          token=$(curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"username":"e2e","password":"e2e-password"}' \
            http://127.0.0.1:8000/api/v1/token/ \
            | /tmp/e2e/bin/python -c 'import json,sys; print(json.load(sys.stdin)["access"])')
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            http://127.0.0.1:8000/api/v1/BOK/metadata/)
          echo "GET /api/v1/BOK/metadata/ -> $code"
          test "$code" = "200"

          curl -s http://127.0.0.1:8000/ > /tmp/index.html
          grep -F 'id="crudkit-config"' /tmp/index.html
          grep -F 'CrudKit Demo' /tmp/index.html
          ! grep -F '{{ crudkit_config_json }}' /tmp/index.html
          grep -F 'window.__CRUDKIT_STATIC_URL__ = "/media-x/"' /tmp/index.html
          ! grep -F '/static/crudkit_frontend' /tmp/index.html

          # The hashed bundle referenced by the shell must be served from the
          # wheel's static files under the project's (non-default) STATIC_URL.
          asset=$(grep -o '/media-x/crudkit_frontend/assets/[^"]*\.js' /tmp/index.html | head -1)
          test -n "$asset"
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000$asset")
          echo "GET $asset -> $code"
          test "$code" = "200"
