name: frontend

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Test
        working-directory: frontend
        run: npm test -- --run
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Assert Django template placeholders survived the build
        run: |
          grep -F '{{ crudkit_config_json }}' backend/src/crudkit_frontend/templates/crudkit_frontend/index.html
          grep -F '{{ csrf_token }}' backend/src/crudkit_frontend/templates/crudkit_frontend/index.html

  # Single stable context for branch protection; matrix job names change over time.
  frontend:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
