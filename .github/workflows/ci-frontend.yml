name: frontend

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Test
        working-directory: frontend
        run: npm test -- --run
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Assert the built shell is Django-template clean
        run: |
          shell=backend/src/crudkit_frontend/templates/crudkit_frontend/index.html
          grep -F '{{ crudkit_config_json }}' "$shell"
          grep -F '{{ csrf_token }}' "$shell"
          grep -F 'window.__CRUDKIT_STATIC_URL__ = {{ crudkit_static_url_json }};' "$shell"
          grep -F '{% load static %}' "$shell"
          grep -F '{% static "crudkit_frontend/' "$shell"
          # No hardcoded static prefix anywhere: the shell uses {% static %}
          # and the bundle builds URLs at runtime from STATIC_URL.
          ! grep -F '/static/' "$shell"
          ! grep -rF --include='*.js' --include='*.css' '/static/crudkit_frontend' \
            backend/src/crudkit_frontend/static/crudkit_frontend/

  # Single stable context for branch protection; matrix job names change over time.
  frontend:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
